  reading tone, facial expression, and hesitation to enable face-to-face AI interaction that
  feels human. Backed by Accel and Lightspeed Venture Partners, the company is pre-product: as of
  this enrichment pass it publishes only a marketing site (About, Press, Contact, Careers) with a
